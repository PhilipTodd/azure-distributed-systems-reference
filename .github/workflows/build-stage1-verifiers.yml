name: Build Stage 1 verification projects
on:
  pull_request:
    paths:
      - 'tests/Stage1.*/**'
      - '.github/workflows/build-stage1-verifiers.yml'
  push:
    branches: [main]
    paths:
      - 'tests/Stage1.*/**'
      - '.github/workflows/build-stage1-verifiers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.403'
      - name: Build the four verification projects with the exact SDK
        run: |
          set -euo pipefail
          dotnet new globaljson --sdk-version 10.0.403 --roll-forward Disable --output "$RUNNER_TEMP/pp-sdk"
          cd "$RUNNER_TEMP/pp-sdk"
          test "$(dotnet --version)" = '10.0.403'
          for probe in Access Hosting Identity Local; do
            project="$GITHUB_WORKSPACE/tests/Stage1.${probe}Probe/Stage1.${probe}Probe.csproj"
            dotnet restore "$project" --locked-mode
            dotnet build "$project" --no-restore --configuration Release
          done
