<div class="lightbox" data-lightbox-root hidden>
  <div class="lightbox__backdrop" data-lightbox-close></div>
  <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close diagram">
    Close
  </button>
  <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
    <p id="lightbox-title" class="visually-hidden">Expanded diagram</p>
    <img class="lightbox__image" data-lightbox-image alt="">
    <p class="lightbox__caption" data-lightbox-caption hidden></p>
  </div>
</div>
