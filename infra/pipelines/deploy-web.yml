# Run after deploy-infrastructure.yml. Replace this page with the Angular
# build output when the application is ready.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-parameterpilot-dev'
  resourceGroupName: 'rg-parameterpilot-dev'
  staticWebAppName: 'stapp-adt-parameterpilot-dev'

steps:
  - checkout: self
  - task: AzureCLI@2
    displayName: Publish coming soon page
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        token="$(az staticwebapp secrets list \
          --name "$(staticWebAppName)" \
          --resource-group "$(resourceGroupName)" \
          --query properties.apiKey -o tsv)"
        if [[ -z "$token" ]]; then
          echo 'Static Web App deployment token was unavailable.' >&2
          exit 1
        fi
        export SWA_CLI_DEPLOYMENT_TOKEN="$token"
        npx --yes @azure/static-web-apps-cli deploy src/web/coming-soon \
          --env production
